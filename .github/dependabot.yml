# Opens weekly PRs to keep dependencies up to date. Related libraries are grouped
# into a single PR so CI runs once per group instead of once per library.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
      # The Android Gradle Plugin, Kotlin, KSP and the Gradle wrapper depend on each other
      # (e.g. AGP 9 needs Gradle 9.6+, Gradle 9.6+ breaks AGP 8), so they must move together.
      build-tooling:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "com.android.*"
          - "gradle-wrapper"
      other:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
