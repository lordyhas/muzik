name: Release APK

# Runs when something lands on `production` (e.g. merging main into it).
# Builds a signed release APK and publishes it as a GitHub Release tagged v<versionName>.
on:
  push:
    branches: [production]
  workflow_dispatch:

# Never run two releases at once, and never cancel one halfway
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create the tag and the GitHub Release

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Read app version
        id: version
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "Releasing $name (versionCode $code)"

      - name: Check the version was bumped
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump versionName and versionCode in app/build.gradle.kts before merging to production."
            exit 1
          fi

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MUZIK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MUZIK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUZIK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUZIK_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing MUZIK_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing MUZIK_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing MUZIK_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing MUZIK_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MUZIK_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MUZIK_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          MUZIK_KEYSTORE_PASSWORD: ${{ secrets.MUZIK_KEYSTORE_PASSWORD }}
          MUZIK_KEY_ALIAS: ${{ secrets.MUZIK_KEY_ALIAS }}
          MUZIK_KEY_PASSWORD: ${{ secrets.MUZIK_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signature and rename APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::Signed APK not found (got: $(ls app/build/outputs/apk/release/))"
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk"
          out="muzik-v$VERSION.apk"
          mv "$apk" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: muzik-release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Muzik $VERSION" \
            --notes "Version $VERSION (versionCode $CODE). Download $APK below and open it on your phone to install." \
            --generate-notes
